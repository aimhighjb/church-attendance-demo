<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"><meta name="theme-color" content="#060813"><title>교회 출석관리 Demo</title><style>
:root{--bg:#050711;--panel:#10192b;--panel2:#1a2941;--text:#fff;--sub:#d9e3f0;--line:#526987;--cyan:#82e8ff;--mint:#86f6c9;--violet:#b1a7ff;--base:18px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:radial-gradient(circle at 14% -10%,#36c8ff22,transparent 30%),radial-gradient(circle at 96% 4%,#9e6cff1b,transparent 27%),linear-gradient(#070a16,#04060d);color:var(--text);min-height:100vh;font-size:var(--base);line-height:1.3}body.xl{--base:21px}.wrap{max-width:760px;margin:auto;padding:8px 8px 92px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -8px 6px;padding:7px 8px;background:#060813e8;border-bottom:1px solid #263b56;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.brand{display:flex;align-items:center;gap:8px;min-width:0}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#55dfff,#6478ff 56%,#a66cff);font-size:18px;font-weight:950;box-shadow:0 0 22px #5edcff25;flex:0 0 auto}.brand b{font-size:19px;letter-spacing:-.5px;white-space:nowrap}.muted{color:var(--sub);font-size:15px;font-weight:700;line-height:1.25}.sizeCtl{display:flex;gap:3px;background:#0c1323;border:1px solid var(--line);padding:3px;border-radius:12px;flex:0 0 auto}.sizeCtl button{min-width:50px;min-height:38px;border:0;border-radius:8px;background:transparent;color:#d4deea;font-weight:900;font-size:14px}.sizeCtl button.on{background:#2b3f60;color:#fff}.proto{font-size:13px;font-weight:800;color:#ffecaf;padding:7px 9px;border:1px solid #ffe19a5c;background:#e5a5000e;border-radius:11px;margin-bottom:7px}.section{margin-top:12px}.section h2{font-size:24px;line-height:1.1;margin:0 0 7px;letter-spacing:-.6px}.card{background:linear-gradient(180deg,#142036f4,#0d1628f1);border:1.5px solid var(--line);border-radius:15px;padding:11px;margin-bottom:6px;box-shadow:0 10px 28px #0004}.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}.v{font-size:36px;font-weight:950;line-height:1}.main{font-size:50px;font-weight:950;line-height:.95;background:linear-gradient(90deg,#8affce,#7ee8ff);-webkit-background-clip:text;background-clip:text;color:transparent}.meet{display:flex;gap:9px;align-items:center;min-height:64px}.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#1b2943;border:1px solid #607797;font-size:20px;flex:0 0 auto}.name{font-size:20px;font-weight:950;line-height:1.15;letter-spacing:-.35px}.badge{display:inline-block;font-size:14px;font-weight:850;color:#f0f5ff;border:1px solid #617895;background:#1a2941;border-radius:999px;padding:4px 7px;margin:5px 3px 0 0}.row{display:grid;grid-template-columns:1fr;gap:6px}.bubbles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.bubble{min-height:76px;border-radius:13px;border:2px solid #526986;background:#142036;color:#fff;text-align:left;padding:8px 7px;position:relative;overflow:hidden}.bubble.on{border-color:#86f6c9;background:linear-gradient(145deg,#174d3d,#10313a);box-shadow:inset 0 0 0 1px #86f6c955,0 0 14px #63eab01c}.bubble.on:after{content:'✓';position:absolute;right:6px;top:5px;font-size:21px;line-height:1;color:#91ffd4;font-weight:950}.bubble b{display:block;font-size:19px;line-height:1.12;padding-right:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.4px}.bubble b small{display:inline;color:#d7e2ef;font-size:14px;font-weight:850;margin-left:2px}.bubble>small{display:block;color:#e0e7f0;font-size:14px;font-weight:750;line-height:1.2;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#09101ff5;border-top:1.5px solid #4a5d78;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(5,1fr);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}.nav button{min-height:56px;border:0;background:transparent;color:#d0dae7;font-size:14px;font-weight:850;line-height:1.25}.nav button span{display:block;font-size:22px;line-height:1.05;margin-bottom:2px}.nav button.on{color:#8beaff;font-weight:950}.touch{cursor:pointer}.touch:active,.bubble:active,.nav button:active,.sizeCtl button:active{transform:scale(.98)}button{font:inherit;touch-action:manipulation}body.xl .brand b{font-size:21px}body.xl .muted{font-size:17px}body.xl .section h2{font-size:27px}body.xl .name{font-size:23px}body.xl .badge{font-size:16px}body.xl .bubble{min-height:86px}body.xl .bubble b{font-size:22px}body.xl .bubble b small,body.xl .bubble>small{font-size:16px}body.xl .nav button{font-size:16px;min-height:61px}@media(max-width:430px){.stats{grid-template-columns:2fr 1fr}.stats .card:first-child{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}.stats .card{padding:10px}.main{font-size:52px}.v{font-size:36px}.brand b{font-size:18px}.muted{font-size:14px}.sizeCtl button{min-width:46px}.section h2{font-size:23px}.bubble b{font-size:18px}.bubble b small{font-size:13px}.bubble>small{font-size:13px}body.xl .bubble b{font-size:21px}body.xl .bubble b small,body.xl .bubble>small{font-size:15px}}@media(min-width:700px){.row{grid-template-columns:repeat(2,1fr)}.bubbles{grid-template-columns:repeat(6,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">교</div><div><b>한인교회 출석관리</b><div class="muted">Admin · iPhone Prototype</div></div></div><div class="sizeCtl" aria-label="글자 크기"><button id="normalBtn" class="on">큰글씨</button><button id="largeBtn">더크게</button></div></div><div class="proto">Public Prototype · 실제 개인정보 입력 금지</div><div class="section"><h2>오늘 요약</h2><div class="stats"><div class="card"><div class="main">13</div><div class="muted">등록교인 Unique</div></div><div class="card"><div class="v">8</div><div class="muted">Guest</div></div><div class="card"><div class="v">12</div><div class="muted">Online</div></div></div></div><div class="section"><h2>오늘 모임</h2><div class="row"><div class="card meet touch"><div class="ico">✦</div><div><div class="name">평일 새벽예배</div><div class="muted">05:30 · 본당</div><span class="badge">체크 중 · 6명</span></div></div><div class="card meet touch"><div class="ico">✧</div><div><div class="name">주일 2부예배</div><div class="muted">11:00 · 본당</div><span class="badge">출석 11명</span><span class="badge">Online 9</span></div></div></div></div><div class="section"><h2>출석체크 미리보기</h2><div class="bubbles"><button class="bubble on"><b>김영수 <small>집사</small></b><small>출장 잦음</small></button><button class="bubble on"><b>이선희 <small>권사</small></b><small>정기</small></button><button class="bubble"><b>박정호 <small>집사</small></b><small>정기</small></button><button class="bubble"><b>최미경 <small>권사</small></b><small>새가족 정착중</small></button><button class="bubble on"><b>정수진 <small>성도</small></b><small>청년부</small></button><button class="bubble"><b>윤태호 <small>집사</small></b><small>가끔</small></button></div></div><div class="section"><h2>이번 주 순모임</h2><div class="card meet touch"><div class="ico">◉</div><div><div class="name">사랑순</div><div class="muted">오늘 6:30 PM · 김영수 집사 가정</div><span class="badge">순원 4/6</span><span class="badge">순자녀들 3</span><span class="badge">방문 1</span></div></div></div></div><nav class="nav"><button class="on"><span>⌂</span>홈</button><button><span>✓</span>출석</button><button><span>♙</span>회원</button><button><span>▤</span>리포트</button><button><span>⋯</span>더보기</button></nav><script>(function(){const key='church-font-size-v2';const n=document.getElementById('normalBtn'),l=document.getElementById('largeBtn');function set(v){document.body.classList.toggle('xl',v==='xl');n.classList.toggle('on',v!=='xl');l.classList.toggle('on',v==='xl');localStorage.setItem(key,v)}set(localStorage.getItem(key)||'normal');n.onclick=()=>set('normal');l.onclick=()=>set('xl');document.querySelectorAll('.bubble').forEach(b=>b.onclick=()=>b.classList.toggle('on'));})();</script></body></html>
