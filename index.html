<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060813"><title>교회 출석관리 Demo</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:radial-gradient(circle at 15% -10%,#36c8ff22,transparent 32%),radial-gradient(circle at 95% 5%,#9e6cff1d,transparent 30%),linear-gradient(#070a16,#04060d);color:#f7fbff;min-height:100vh}*{box-sizing:border-box}.wrap{max-width:760px;margin:auto;padding:18px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#55dfff,#6478ff 56%,#a66cff);font-weight:900;box-shadow:0 0 28px #5edcff29}.muted{color:#8ea1bb;font-size:12px}.card{background:linear-gradient(180deg,#111a2ee6,#0b1120dd);border:1px solid #26375588;border-radius:20px;padding:15px;margin-bottom:10px}.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.v{font-size:30px;font-weight:900}.main{font-size:44px;background:linear-gradient(90deg,#71efc1,#73dcff);-webkit-background-clip:text;color:transparent}.meet{display:flex;gap:10px;align-items:center}.ico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:#18233acc}.name{font-weight:800}.badge{display:inline-block;font-size:10px;color:#8ea1bb;border:1px solid #26375588;border-radius:999px;padding:4px 7px;margin:6px 4px 0 0}.section{margin-top:20px}.section h2{font-size:19px;margin:0 0 10px}.bubbles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bubble{min-height:72px;border-radius:16px;border:1px solid #26375588;background:#121a2dcc;color:#f7fbff;text-align:left;padding:10px}.bubble.on{border-color:#64eabb;background:linear-gradient(145deg,#1ebc8429,#176d7b16)}.bubble b{display:block}.bubble
