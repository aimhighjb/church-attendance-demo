<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5"><meta name="theme-color" content="#060813"><title>교회 출석관리 Demo</title><style>
:root{--bg:#050711;--panel:#0f1729;--panel2:#18243a;--text:#ffffff;--sub:#c7d3e5;--line:#415473;--cyan:#75e3ff;--mint:#79f2c3;--violet:#a99cff;--warn:#ffe29a;--base:16px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:radial-gradient(circle at 15% -10%,#36c8ff25,transparent 32%),radial-gradient(circle at 95% 5%,#9e6cff20,transparent 30%),linear-gradient(#070a16,#04060d);color:var(--text);min-height:100vh;font-size:var(--base);line-height:1.45}body.large{--base:19px}.wrap{max-width:760px;margin:auto;padding:18px 14px 112px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#55dfff,#6478ff 56%,#a66cff);font-size:20px;font-weight:900;box-shadow:0 0 28px #5edcff30;flex:0 0 auto}.brand b{font-size:18px;letter-spacing:-.3px}.muted{color:var(--sub);font-size:14px;font-weight:600;line-height:1.4}.sizeCtl{display:flex;gap:4px;background:#0c1323;border:1px solid var(--line);padding:4px;border-radius:13px;flex:0 0 auto}.sizeCtl button{min-width:46px;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-weight:800}.sizeCtl button.on{background:#263754;color:#fff}.card{background:linear-gradient(180deg,#131d32f2,#0c1425ee);border:1.5px solid var(--line);border-radius:20px;padding:17px;margin-bottom:11px;box-shadow:0 14px 38px #0005}.stats{display:grid;grid-template-columns:2fr 1fr 1fr;gap:9px}.v{font-size:34px;font-weight:900;line-height:1}.main{font-size:48px;font-weight:950;line-height:1;background:linear-gradient(90deg,#8affce,#7ee8ff);-webkit-background-clip:text;background-clip:text;color:transparent}.meet{display:flex;gap:13px;align-items:center;min-height:78px}.ico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:#1b2943;border:1px solid #506785;font-size:22px;flex:0 0 auto}.name{font-size:18px;font-weight:900;line-height:1.3;letter-spacing:-.2px}.badge{display:inline-block;font-size:13px;font-weight:750;color:#e7f0ff;border:1px solid #506785;background:#18243a;border-radius:999px;padding:6px 9px;margin:8px 5px 0 0}.section{margin-top:24px}.section h2{font-size:23px;line-height:1.25;margin:0 0 12px;letter-spacing:-.4px}.bubbles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.bubble{min-height:92px;border-radius:17px;border:2px solid #465a78;background:#131d31;color:#fff;text-align:left;padding:12px 10px;position:relative;overflow:hidden}.bubble.on{border-color:#79f2c3;background:linear-gradient(145deg,#174538,#102b34);box-shadow:inset 0 0 0 1px #79f2c350,0 0 18px #63eab01e}.bubble.on:after{content:'✓';position:absolute;right:8px;top:7px;font-size:19px;line-height:1;color:#8affce;font-weight:950}.bubble b{display:block;font-size:17px;line-height:1.3;padding-right:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bubble small{display:block;color:#d1dbea;font-size:13px;font-weight:650;line-height:1.35;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bubble b small{display:inline;color:#b9c9dd;font-size:13px;font-weight:700;margin:0 0 0 3px}.nav{position:fixed;z-index:10;left:0;right:0;bottom:0;background:#09101ff4;border-top:1.5px solid #40516c;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{min-height:62px;border:0;background:transparent;color:#c0ccdc;font-size:13px;font-weight:750;line-height:1.55}.nav button span{display:block;font-size:22px;line-height:1.1}.nav button.on{color:#85e9ff;font-weight:900}.proto{font-size:14px;font-weight:700;color:#ffe9a8;padding:11px 12px;border:1px solid #ffe19a66;background:#e5a50010;border-radius:14px;margin-bottom:17px}.row{display:grid;grid-template-columns:1fr;gap:9px}button{font:inherit;touch-action:manipulation}.touch{cursor:pointer}.touch:active,.bubble:active,.nav button:active,.sizeCtl button:active{transform:scale(.98)}body.large .brand b{font-size:20px}body.large .muted{font-size:16px}body.large .section h2{font-size:26px}body.large .name{font-size:21px}body.large .badge{font-size:15px;padding:7px 10px}body.large .bubble{min-height:108px}body.large .bubble b{font-size:20px}body.large .bubble small,body.large .bubble b small{font-size:15px}body.large .nav button{font-size:15px;min-height:68px}@media(max-width:430px){.stats{grid-template-columns:2fr 1fr}.stats .card:first-child{grid-row:span 2;display:flex;flex-direction:column;justify-content:center}.stats .card{padding:15px}.main{font-size:50px}.v{font-size:32px}.brand b{font-size:17px}.sizeCtl button{min-width:42px}.bubble b{font-size:16px}.bubble b small{font-size:12px}body.large .bubble b{font-size:18px}body.large .bubble b small{font-size:14px}}@media(min-width:700px){.row{grid-template-columns:repeat(2,1fr)}.bubbles{grid-template-columns:repeat(6,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">교</div><div><b>한인교회 출석관리</b><div class="muted">Admin · iPhone Prototype</div></div></div><div class="sizeCtl" aria-label="글자 크기"><button id="normalBtn" class="on">기본</button><button id="largeBtn">크게</button></div></div><div class="proto">Public Prototype · 실제 개인정보 입력 금지</div><div class="section"><h2>오늘 요약</h2><div class="stats"><div class="card"><div class="main">13</div><div class="muted">등록교인 Unique</div></div><div class="card"><div class="v">8</div><div class="muted">Guest</div></div><div class="card"><div class="v">12</div><div class="muted">Online</div></div></div></div><div class="section"><h2>오늘 모임</h2><div class="row"><div class="card meet touch"><div class="ico">✦</div><div><div class="name">평일 새벽예배</div><div class="muted">05:30 · 본당</div><span class="badge">체크 중 · 6명</span></div></div><div class="card meet touch"><div class="ico">✧</div><div><div class="name">주일 2부예배</div><div class="muted">11:00 · 본당</div><span class="badge">출석 11명</span><span class="badge">Online 9</span></div></div></div></div><div class="section"><h2>출석체크 미리보기</h2><div class="bubbles"><button class="bubble on"><b>김영수 <small>집사</small></b><small>출장 잦음</small></button><button class="bubble on"><b>이선희 <small>권사</small></b><small>정기</small></button><button class="bubble"><b>박정호 <small>집사</small></b><small>정기</small></button><button class="bubble"><b>최미경 <small>권사</small></b><small>새가족 정착중</small></button><button class="bubble on"><b>정수진 <small>성도</small></b><small>청년부</small></button><button class="bubble"><b>윤태호 <small>집사</small></b><small>가끔</small></button></div></div><div class="section"><h2>이번 주 순모임</h2><div class="card meet touch"><div class="ico">◉</div><div><div class="name">사랑순</div><div class="muted">오늘 6:30 PM · 김영수 집사 가정</div><span class="badge">순원 4/6</span><span class="badge">순자녀들 3</span><span class="badge">방문 1</span></div></div></div></div><nav class="nav"><button class="on"><span>⌂</span>홈</button><button><span>✓</span>출석</button><button><span>♙</span>회원</button><button><span>▤</span>리포트</button><button><span>⋯</span>더보기</button></nav><script>(function(){const key='church-font-size';const n=document.getElementById('normalBtn'),l=document.getElementById('largeBtn');function set(v){document.body.classList.toggle('large',v==='large');n.classList.toggle('on',v!=='large');l.classList.toggle('on',v==='large');localStorage.setItem(key,v)}set(localStorage.getItem(key)||'normal');n.onclick=()=>set('normal');l.onclick=()=>set('large');document.querySelectorAll('.bubble').forEach(b=>b.onclick=()=>b.classList.toggle('on'));})();</script></body></html>
