cls:x[5],sg:x[6],lr:x[7]})),defs:{dawn:['평일 새벽예배','05:30','본당','✦',0],sun1:['주일 1부예배','09:00','본당','✧',0],sun2:['주일 2부예배','11:00','본당','✧',1],em:['EM 예배','13:30','비전홀','◎',1]},att:{dawn:['1','2','3','8','14','15'],sun1:['1','2','3','4','6','9','14','15'],sun2:['1','2','3','4','5','6','7','8','9','14','15'],em:['5','7']},cnt:{dawn:{guest:1,online:0},sun1:{guest:2,online:0},sun2:{guest:4,online:9},em:{guest:1,online:3}},group:{att:['1','2','3','14'],other:1,child:3,guest:1,note:'박집사 다음 주 검사 예정. 함께 기도 부탁드립니다.',by:'김영수 집사',at:'오늘 10:20'}});let S;try{S=Object.assign(D(),JSON.parse(localStorage.getItem(K)||'{}'))}catch{S=D()}const save=()=>localStorage.setItem(K,JSON.stringify(S)),U=()=>new Set(Object.values(S.att).flat()).size,G=()=>Object.values(S.cnt).reduce((n,x)=>n+x.guest,0),O=()=>Object.values(S.cnt).reduce((n,x)=>n+x.online,0),gm=()=>S.members.filter(x=>x.sg==='사랑순'),nav=()=>S.role==='leader'?[['home','⌂','홈'],['att','✓','출석'],['group','◉','내 순모임'],['reports','▤','리포트'],['more','⋯','더보기']]:[['home','⌂','홈'],['att','✓','출석'],['members','♙','회원'],['reports','▤','리포트'],['more','⋯','더보기']];function render(){document.body.classList.toggle('big',S.font==='big');app.innerHTML=`<div class="app"><div class="top"><div class="brand"><div class="logo">교</div><div><div class="bt">교회 출석관리 iPhone Test</div><div class="bs">${S.role==='admin'?'Admin':S.role==='user'?'User':'순장/부순장'} · Compact v0.2</div></div></div><div class="seg"><button data-font="normal" class="${S.font==='normal'?'on':''}">기본</button><button data-font="big" class="${S.font==='big'?'on':''}">크게</button></div></div><div class="notice">Test Version · 실제 개인정보 입력 금지 · iPhone 기준</div><div class="seg" style="margin-bottom:7px"><button data-role="admin" class="${S.role==='admin'?'on':''}">Admin</button><button data-role="user" class="${S.role==='user'?'on':''}">User</button><button data-role="leader" class="${S.role==='leader'?'on':''}">순장/부순장</button></div>${page()}</div><nav class="nav">${nav().map(x=>`<button data-page="${x[0]}" class="${S.page===x[0]?'on':''}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`;bind()}function page(){return S.page==='home'?home():S.page==='att'?attendance():S.page==='members'?members():S.page==='group'?group():S.page==='reports'?reports():more()}function home(){return `<section class="sec"><div class="sh"><h2>오늘 요약</h2><span class="muted">8월 13일 목요일</span></div><div class="stats"><div class="card stat"><div class="main">${U()}</div><div class="lab">등록교인 Unique</div><div class="cap">오늘 실제 참석</div></div><div class="card stat"><div class="num">${G()}</div><div class="lab">Guest</div><div class="cap">방문자</div></div><div class="card stat"><div class="num">${O()}</div><div class="lab">Online</div><div class="cap">온라인</div></div></div></section><section class="sec"><div class="sh"><h2>오늘 모임</h2><span class="muted">터치 → 출석</span></div><div class="grid">${['dawn','sun2','em'].map(mc).join('')}</div></section>${S.role!=='user'?`<section class="sec"><div class="sh"><h2>${S.role==='leader'?'내 순모임':'이번 주 순모임'}</h2></div><div class="card meet tap" data-group><div class="ico">◉</div><div><div class="title">사랑순</div><div class="meta">오늘 6:30 PM · 김영수 집사 가정</div><div class="badges"><span class="badge">순원 ${S.group.att.length}/${gm().length}</span><span class="badge">순자녀들 ${S.group.child}</span><span class="badge">방문 ${S.group.guest}</span></div></div></div></section>`:''}`}function mc(id){let m=S.defs[id],a=S.att[id].length,c=S.cnt[id];return `<div class="card meet tap" data-open="${id}"><div class="ico">${m[3]}</div><div><div class="title">${m[0]}</div><div class="meta">${m[1]} · ${m[2]}</div><div class="badges"><span class="badge">출석 ${a}명</span><span class="badge">Guest ${c.guest}</span>${m[4]?`<span class="badge">Online ${c.online}</span>`:''}</div></div></div>`}function attendance(){let m=S.defs[S.meet],a=S.att[S.meet],c=S.cnt[S.meet],list=S.members.filter(x=>{if(S.meet==='em'&&!(x.d==='청년부'||x.cls==='가끔'))return false;let q=S.q.toLowerCase();if(q&&!(`${x.n} ${x.t} ${x.note} ${x.d}`.toLowerCase().includes(q)))return false;if(S.view==='on'&&!a.includes(x.id))return false;if(S.view==='off'&&a.includes(x.id))return false;return true});return `<section class="sec"><div class="sh"><h2>출석체크</h2><span class="muted">${m[0]}</span></div><div class="seg" style="margin-bottom:7px">${Object.keys(S.defs).map(id=>`<button data-meet="${id}" class="${S.meet===id?'on':''}">${S.defs[id][0].replace('예배','')}</button>`).join('')}</div><div class="sum"><b>${m[0]}</b><span>${m[1]} · ${m[2]}</span><span>출석 ${a.length}</span><span>Guest ${c.guest}</span>${m[4]?`<span>Online ${c.online}</span>`:''}</div><div class="tools"><input id="q" class="search" placeholder="이름 · 직분 · Note 검색" value="${S.q}"><div class="seg"><button data-view="all" class="${S.view==='all'?'on':''}">전체</button><button data-view="on" class="${S.view==='on'?'on':''}">출석</button><button data-view="off" class="${S.view==='off'?'on':''}">미출석</button></div></div>${mg('정기',list.filter(x=>x.cls==='정기'),a)}${mg('가끔',list.filter(x=>x.cls==='가끔'),a)}<section class="sec"><div class="sh"><h2>추가 인원</h2></div><div class="cgrid">${cc('guest','방문자',c.guest)}${m[4]?cc('online','온라인',c.online):''}</div></section>${mg('장기결석',list.filter(x=>x.cls==='장기'),a)}</section>`}function mg(label,list,a){if(!list.length)return'';return `<div><div class="gl">${label} · ${list.length}</div><div class="bubbles">${list.map(x=>`<button class="bubble ${a.includes(x.id)?'on':''}" data-toggle="${x.id}"><span class="bn">${x.n}<span class="btit">${x.t}</span></span><span class="bnote">${x.note||x.d}</span></button>`).join('')}</div></div>`}function cc(k,l,v){return `<div class="card counter"><b>${l}</b><div class="ctl"><button data-step="${k}" data-d="-1">−</button><input data-in="${k}" value="${v}" type="number" min="0"><button data-step="${k}" data-d="1">＋</button></div></div>`}function group(){let members=gm(),rate=Math.round(S.group.att.length/members.length*100);return `<section class="sec"><div class="sh"><h2>내 순모임</h2><span class="muted">사랑순</span></div><div class="sum"><b>순원 ${S.group.att.length}/${members.length}</b><span>${rate}%</span><span>기타회원 ${S.group.other}</span><span>순자녀들 ${S.group.child}</span><span>방문 ${S.group.guest}</span></div><div class="gl">순원 · ${members.length}</div><div class="bubbles">${members.map(x=>`<button class="bubble ${S.group.att.includes(x.id)?'on':''}" data-gtoggle="${x.id}"><span class="bn">${x.n}<span class="btit">${x.t}</span></span><span class="bnote">${x.lr||x.d}</span></button>`).join('')}</div><section class="sec"><div class="sh"><h2>추가 인원</h2></div><div class="cgrid">${gcc('child','순자녀들',S.group.child)}${gcc('guest','방문자',S.group.guest)}${gcc('other','기타회원',S.group.other)}</div></section><section class="sec"><div class="sh"><h2>특이사항 / 기도제목</h2></div><div class="card note"><textarea id="note">${S.group.note}</textarea><div class="muted" style="margin-top:6px">마지막 수정: ${S.group.by} · ${S.group.at}</div><div class="right"><button id="saveNote" class="btn primary">저장</button></div></div></section></section>`}function gcc(k,l,v){return `<div class="card counter"><b>${l}</b><div class="ctl"><button data-gstep="${k}" data-d="-1">−</button><input data-gin="${k}" value="${v}" type="number" min="0"><button data-gstep="${k}" data-d="1">＋</button></div></div>`}function members(){return `<section class="sec"><div class="sh"><h2>회원관리</h2></div><div class="rows">${S.members.map(x=>`<div class="card row"><div class="avatar">${x.n[0]}</div><div><div class="rt">${x.n} ${x.t}</div><div class="rs">${x.d}${x.sg?' · '+x.sg:''}${x.lr?' · '+x.lr:''}${x.note?' · '+x.note:''}</div></div><span class="badge">Active</span></div>`).join('')}</div></section>`}function reports(){let rate=Math.round(S.group.att.length/gm().length*100);return `<section class="sec"><div class="sh"><h2>리포트</h2><span class="muted">Test</span></div><div class="rows"><div class="card"><div class="rt">이번 주 예배 요약</div><div class="rs">1부 8명 · 2부 11명 · EM 2명</div></div><div class="card"><div class="rt">등록교인 Unique</div><div class="main" style="font-size:38px;margin-top:7px">${U()}</div><div class="rs">Guest ${G()} · Online ${O()}</div><div class="bar"><i style="width:78%"></i></div></div><div class="card"><div class="rt">순모임 요약</div><div class="num" style="margin-top:7px">${rate}%</div><div class="rs">순원 ${S.group.att.length}/${gm().length} · 순자녀들 ${S.group.child} · 방문 ${S.group.guest}</div><div class="bar"><i style="width:${rate}%"></i></div></div></div></section>`}function more(){let rows=S.role==='admin'?[['모임 관리','정규 / 기간형 / 일회성'],['순 관리','순원 / 순장 / 부순장'],['사용자 / 권한','Admin / User'],['백업 / Archive','설계 예정'],['Audit Log','모든 변경 이력'],['Demo 초기화','테스트 데이터 초기화']]:[['화면 설정','글자 크기 / 테마'],['도움말','출석 / 리포트'],['Demo 초기화','테스트 데이터 초기화']];return `<section class="sec"><div class="sh"><h2>더보기</h2></div><div class="rows">${rows.map(x=>`<div class="card tap" ${x[0]==='Demo 초기화'?'id="reset"':''}><div class="rt">${x[0]}</div><div class="rs">${x[1]}</div></div>`).join('')}</div></section>`}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}function bind(){document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{S.font=b.dataset.font;save();render()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;if(S.role==='leader'&&S.page==='members')S.page='home';save();render()});document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{S.page=b.dataset.page;save();render();scrollTo(0,0)});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.meet=b.dataset.open;S.page='att';save();render();scrollTo(0,0)});document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{S.page='group';save();render()});document.querySelectorAll('[data-meet]').forEach(b=>b.onclick=()=>{S.meet=b.dataset.meet;save();render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;save();render()});let q=document.getElementById('q');if(q)q.onchange=e=>{S.q=e.target.value;save();render()};document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let a=S.att[S.meet],i=a.indexOf(b.dataset.toggle);i>=0?a.splice(i,1):a.push(b.dataset.toggle);save();render()});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{let k=b.dataset.step;S.cnt[S.meet][k]=Math.max(0,S.cnt[S.meet][k]+Number(b.dataset.d));save();render()});document.querySelectorAll('[data-in]').forEach(i=>i.onchange=e=>{S.cnt[S.meet][e.target.dataset.in]=Math.max(0,Number(e.target.value||0));save();render()});document.querySelectorAll('[data-gtoggle]').forEach(b=>b.onclick=()=>{let a=S.group.att,i=a.indexOf(b.dataset.gtoggle);i>=0?a.splice(i,1):a.push(b.dataset.gtoggle);save();render()});document.querySelectorAll('[data-gstep]').forEach(b=>b.onclick=()=>{let k=b.dataset.gstep;S.group[k]=Math.max(0,S.group[k]+Number(b.dataset.d));save();render()});document.querySelectorAll('[data-gin]').forEach(i=>i.onchange=e=>{S.group[e.target.dataset.gin]=Math.max(0,Number(e.target.value||0));save();render()});let sn=document.getElementById('saveNote');if(sn)sn.onclick=()=>{S.group.note=document.getElementById('note').value.slice(0,1000);S.group.by=S.role==='leader'?'순장/부순장':S.role==='user'?'User':'Admin';S.group.at=new Date().toLocaleString('ko-KR');save();render();toast('Note 저장 완료')};let r=document.getElementById('reset');if(r)r.onclick=()=>{S=D();save();render();toast('Demo 초기화 완료')}}render()})();</script></body></html>
