<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060813"><title>교회 출석관리 Compact Demo</title><style>:root{--card:#111b2f;--text:#fff;--sub:#d4deeb;--line:#4e6687;--mint:#7af0c2}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:radial-gradient(circle at 15% -10%,#36c8ff22,transparent 30%),linear-gradient(#070a16,#04060d);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:760px;margin:auto;padding:8px 8px 88px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.brand{display:flex;align-items:center;gap:8px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#55dfff,#6478ff,#a66cff);font-weight:900}.brand b{font-size:18px}.sub{color:var(--sub);font-size:13px;font-weight:700}.size button{border:1px solid var(--line);background:#17243a;color:#fff;border-radius:9px;padding:7px 9px;font-weight:800}.sec{margin-top:10px}.sec h2{font-size:23px;line-height:1.08;margin:0 0 6px}.stats{display:grid;grid-template-columns:1.45fr 1fr 1fr;gap:5px}.card{background:linear-gradient(#142036,#0d1628);border:1.5px solid var(--line);border-radius:14px;padding:9px 10px}.stat{min-height:76px;display:flex;flex-direction:column;justify-content:center}.big{font-size:42px;font-weight:950;line-height:.95;color:#7ff0c8}.num{font-size:30px;font-weight:950;line-height:1}.label{font-size:13px;font-weight:850;margin-top:3px}.meetgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.meet{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:center;min-height:66px}.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;border:1px solid #617996;background:#1b2943;font-size:18px}.name{font-size:18px;font-weight:950;line-height:1.08}.meta{font-size:12px;color:var(--sub);font-weight:750;margin-top:2px}.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.badge{font-size:11px;font-weight:850;border:1px solid #617996;background:#1a2941;border-radius:999px;padding:4px 7px}.bubbles{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.bubble{min-height:72px;border:2px solid #526986;border-radius:13px;background:#142036;color:#fff;text-align:left;padding:7px;position:relative}.bubble b{font-size:17px}.bubble small{font-size:12px;color:#dce5ef;font-weight:700}.bubble.on{border-color:var(--mint);background:linear-gradient(145deg,#174d3d,#10313a)}.bubble.on:after{content:'✓';position:absolute;right:6px;top:4px;color:#91ffd4;font-size:19px;font-weight:950}.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#09101ff5;border-top:1px solid #40516c;padding:4px 3px calc(5px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#d0dae7;font-size:13px;font-weight:850;min-height:53px}.nav button span{display:block;font-size:20px}.nav .on{color:#8beaff}body.large .sec h2{font-size:26px}body.large .name{font-size:21px}body.large .label{font-size:15px}body.large .meta,body.large .badge{font-size:13px}body.large .bubble b{font-size:19px}body.large .bubble small{font-size:14px}</style></head><body><div class="wrap"><div class="top"><div class="brand"><div class="logo">교</div><div><b>한인교회 출석관리</b><div class="sub">Admin · Compact Prototype</div></div></div><div class="size"><button id="sz">글씨 크게</button></div></div><section class="sec"><h2>오늘 요약</h2><div class="stats"><div class="card stat"><div class="big">13</div><div class="label">등록교인 Unique</div></div><div class="card stat"><div class="num">8</div><div class="label">Guest</div></div><div class="card stat"><div class="num">12</div><div class="label">Online</div></div></div></section><section class="sec"><h2>오늘 모임</h2><div class="meetgrid"><div class="card meet"><div class="ico">✦</div><div><div class="name">평일 새벽예배</div><div class="meta">05:30 · 본당</div><div class="badges"><span class="badge">체크 중 · 6명</span></div></div></div><div class="card meet"><div class="ico">✧</div><div><div class="name">주일 2부예배</div><div class="meta">11:00 · 본당</div><div class="badges"><span class="badge">출석 11명</span><span class="badge">Online 9</span></div></div></div></div></section><section class="sec"><h2>출석체크</h2><div class="bubbles"><button class="bubble on"><b>김영수 <small>집사</small></b><br><small>출장 잦음</small></button><button class="bubble on"><b>이선희 <small>권사</small></b><br><small>정기</small></button><button class="bubble"><b>박정호 <small>집사</small></b><br><small>정기</small></button><button class="bubble"><b>최미경 <small>권사</small></b><br><small>새가족 정착중</small></button><button class="bubble on"><b>정수진 <small>성도</small></b><br><small>청년부</small></button><button class="bubble"><b>윤태호 <small>집사</small></b><br><small>가끔</small></button></div></section><section class="sec"><h2>이번 주 순모임</h2><div class="card meet"><div class="ico">◉</div><div><div class="name">사랑순</div><div class="meta">오늘 6:30 PM · 김영수 집사 가정</div><div class="badges"><span class="badge">순원 4/6</span><span class="badge">순자녀들 3</span><span class="badge">방문 1</span></div></div></div></section></div><nav class="nav"><button class="on"><span>⌂</span>홈</button><button><span>✓</span>출석</button><button><span>♙</span>회원</button><button><span>▤</span>리포트</button><button><span>⋯</span>더보기</button></nav><script>const k='church-large-v2',b=document.getElementById('sz');function s(v){document.body.classList.toggle('large',v);localStorage.setItem(k,v?'1':'0');b.textContent=v?'기본 글씨':'글씨 크게'}s(localStorage.getItem(k)==='1');b.onclick=()=>s(!document.body.classList.contains('large'));document.querySelectorAll('.bubble').forEach(x=>x.onclick=()=>x.classList.toggle('on'));</script></body></html>
